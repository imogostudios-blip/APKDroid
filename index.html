<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>APKDroid</title>

<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#141415"/>
<meta name="application-name" content="APKDroid"/>
<meta name="apple-mobile-web-app-title" content="APKDroid"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="icon" type="image/png" sizes="192x192" href="res/icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="res/icons/icon-512.png"/>
<link rel="apple-touch-icon" href="res/icons/icon-192.png"/>
<link rel="shortcut icon" href="favicon.png"/>

<link rel="stylesheet" href="res/fonts/fonts.css"/>
<link rel="stylesheet" href="src/styles/tailwind.css"/>
<link rel="stylesheet" href="src/styles/app.css"/>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="src/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}
</script>

<script>
/* Fullscreen: auto-attempt on load + on any interaction (like the game) */
(function(){
  function requestFS(){
    var d = document.documentElement;
    var req = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
    if(req && !document.fullscreenElement && !document.webkitFullscreenElement){
      try{ req.call(d); }catch(e){}
    }
  }
  // Try automatically shortly after load (same technique as the game)
  window.addEventListener('load', function(){
    setTimeout(requestFS, 120);
    setTimeout(requestFS, 600);
  });
  // Also on any user interaction anywhere
  ['click','touchstart','pointerdown','keydown'].forEach(function(ev){
    document.addEventListener(ev, requestFS, {capture:true, passive:true});
  });
  // Keep trying briefly in case the first auto attempt is blocked
  var tries = 0;
  var iv = setInterval(function(){
    requestFS();
    if(++tries > 8) clearInterval(iv);
  }, 800);
})();
</script>

</body>
</html>
